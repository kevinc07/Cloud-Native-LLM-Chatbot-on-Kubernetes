apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
data:
  GEMINI_MODEL: {{ .Values.config.geminiModel | quote }}
  TEMPERATURE: {{ .Values.config.temperature | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  MONGO_HOST: "mongo"
  MONGO_DB: {{ .Values.mongo.db | quote }}
  HISTORY_MAX_MESSAGES: {{ .Values.config.historyMaxMessages | quote }}
  MAX_OUTPUT_TOKENS: {{ .Values.config.maxOutputTokens | quote }}
{{- if .Values.redis.enabled }}
  REDIS_HOST: "redis"
  REDIS_TTL_SECONDS: {{ .Values.redis.ttlSeconds | quote }}
{{- end }}
{{- if .Values.fakeLlm.enabled }}
  FAKE_LLM: "true"
  FAKE_LLM_DELAY_SECONDS: {{ .Values.fakeLlm.delaySeconds | quote }}
  FAKE_LLM_ERROR_RATE: {{ .Values.fakeLlm.errorRate | quote }}
  FAKE_LLM_INPUT_TOKENS: {{ .Values.fakeLlm.inputTokens | quote }}
  FAKE_LLM_OUTPUT_TOKENS: {{ .Values.fakeLlm.outputTokens | quote }}
{{- end }}
