# 對外只有一個網址(ingress.host),用「路徑」分流:
#   /chat、/health → backend      其他(/)→ frontend
# /metrics 沒有列在這裡,所以從外面打會是 404;Prometheus 在叢集內直接連 backend Service,不經過 Ingress。
# 前端和 API 同一個網址(同源),所以瀏覽器不會觸發 CORS,前端也不用把 API 網址烤進 image。
#
# 拆成兩個 Ingress 是因為限流是「整個 Ingress」一套設定:
# API 要嚴(每次呼叫都花 Gemini 額度),靜態網頁要鬆(載入一頁會連抓好幾個檔案)。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatbot-frontend
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress.rateLimit.frontendRps | quote }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: chatbot-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatbot-backend
  annotations:
    # 以「來源 IP」計:每秒最多 limitRps 個請求(可短暫突發 limitRps × 5),同時連線數上限 limitConnections。
    # 超過的請求在 Ingress 就被擋下(HTTP 503),不會到 backend,也不會花 Gemini 額度。
    nginx.ingress.kubernetes.io/limit-rps: {{ .Values.ingress.rateLimit.apiRps | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ .Values.ingress.rateLimit.apiConnections | quote }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - pathType: Prefix
            path: /chat
            backend:
              service:
                name: chatbot-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - pathType: Prefix
            path: /health
            backend:
              service:
                name: chatbot-backend
                port:
                  number: {{ .Values.backend.service.port }}
