# GitLab CI pipeline:  test  →  build  →  release
#   (build / release 只有 main 分支才會跑)
#
# 「測試失敗就擋住發版」靠的是 stages 的順序:同一個 pipeline 裡,
# 前一個 stage 只要有任何 job 失敗,後面的 stage 就不會執行 → image 不會被建出來。
#
# image 推到 GitLab Container Registry($CI_REGISTRY_IMAGE),登入用的帳密是 GitLab 自動注入的
# 變數(CI_REGISTRY_USER / CI_REGISTRY_PASSWORD),不需要自己設任何 secret。

stages:
  - test
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ---- test ------------------------------------------------------------------
backend-test:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  script:
    - cd chatbot-backend
    - pip install -r requirements-dev.txt
    - python -m pytest -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: chatbot-backend/report.xml

helm-lint:
  stage: test
  image:
    name: alpine/helm:3.15.4
    entrypoint: [""]
  script:
    - helm lint mychart
    # 真的渲染一次:lint 抓不到的模板錯誤(例如 values 欄位拼錯)在這裡會失敗
    - helm template chatbot mychart > /dev/null

# ---- build -----------------------------------------------------------------
# 用 docker-in-docker:在 job 裡再起一個 docker daemon 來 build image。
#
# 為什麼指定 arm64 runner:AKS 的 node 是 ARM(B2ps_v2),image 架構必須相同,
# 否則 Pod 啟動就會 `exec format error`(Day 16 實際踩到)。GitLab 預設 runner 是 amd64,
# 所以改用它提供的 arm64 runner 原生 build,不需要 QEMU 模擬。
.docker-build:
  stage: build
  tags: [saas-linux-small-arm64]
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build-backend:
  extends: .docker-build
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/chatbot-backend"
    # 先拉 latest 當 layer cache(第一次不存在會失敗,所以 || true)
    - docker pull "$IMAGE:latest" || true
    - docker build --cache-from "$IMAGE:latest" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" chatbot-backend
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"

build-frontend:
  extends: .docker-build
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/chatbot-frontend"
    - docker pull "$IMAGE:latest" || true
    - docker build --cache-from "$IMAGE:latest" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" chatbot-frontend
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"

# ---- release ---------------------------------------------------------------
# GitOps 的最後一哩:CI 不碰 cluster,只負責把「剛建好的 image tag」寫回 git 的 values.yaml。
# 接著 ArgoCD 偵測到 git 變了,自己把新版本部署上去。
#
# 要先在 GitLab 專案設 CI 變數 CI_PUSH_TOKEN(專案 access token,Maintainer、write_repository,勾 Masked)。
# commit 訊息帶 [skip ci]:這個 commit 只改 tag,不該再觸發一輪 pipeline(否則會無限循環)。
# 因為 test、build 兩個 stage 都綠了才會跑到這裡,測試失敗的版本永遠不會被寫進 values.yaml。
bump-image-tag:
  stage: release
  image:
    name: alpine/git:2.45.2
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - test -n "$CI_PUSH_TOKEN" || { echo "缺少 CI 變數 CI_PUSH_TOKEN,見 .gitlab-ci.yml 註解"; exit 1; }
    - git clone --depth 1 --branch "$CI_DEFAULT_BRANCH" "https://oauth2:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" release-repo
    - cd release-repo
    - |
      sed -i "s|^    tag: .*|    tag: ${CI_COMMIT_SHORT_SHA}|" mychart/values.yaml
    # 防呆:backend 與 frontend 各一行,一共該改到 2 行
    - |
      test "$(grep -c "^    tag: ${CI_COMMIT_SHORT_SHA}$" mychart/values.yaml)" = 2
    - git config user.name "gitlab-ci"
    - git config user.email "ci@gitlab.invalid"
    - git commit -am "release ${CI_COMMIT_SHORT_SHA} [skip ci]" || { echo "tag 已是最新,不需 commit"; exit 0; }
    # 兩次 pipeline 同時結束時 push 可能被擋(non-fast-forward),重新 rebase 再推
    - git push origin "HEAD:${CI_DEFAULT_BRANCH}" || { git pull --rebase origin "${CI_DEFAULT_BRANCH}" && git push origin "HEAD:${CI_DEFAULT_BRANCH}"; }
