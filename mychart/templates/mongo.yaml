# MongoDB:對話紀錄的長期儲存(source of truth)。
# 單一實例、無 HA(已知限制,Day 25-26 會寫進 README)。
# 帳密來自事先手動建立的 Secret(.Values.mongo.secretName),不寫在 chart 裡。
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  # clusterIP: None = headless service:不做負載平衡,而是讓 DNS 直接解析到 Pod,
  # StatefulSet 需要它來提供穩定的網路身分(mongo-0.mongo)。
  clusterIP: None
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: "{{ .Values.mongo.image }}"
          ports:
            - containerPort: 27017
          # MONGO_INITDB_ROOT_USERNAME / PASSWORD:只在資料目錄「第一次是空的」時
          # 建立 root 帳號;之後 Pod 重建、資料還在,這兩個值就不再生效。
          envFrom:
            - secretRef:
                name: {{ .Values.mongo.secretName }}
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
  # 每個 Pod 自己一顆雲端硬碟(PVC)。Pod 被刪重建,會掛回同一顆,資料就還在。
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.mongo.storageClass }}
        resources:
          requests:
            storage: {{ .Values.mongo.storage }}
