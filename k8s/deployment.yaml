apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chatbot-backend
  template:
    metadata:
      labels:
        app: chatbot-backend
    spec:
      containers:
        - name: chatbot-backend
          image: acrchatbotkevin.azurecr.io/chatbot-backend:v3
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: chatbot-secret
            