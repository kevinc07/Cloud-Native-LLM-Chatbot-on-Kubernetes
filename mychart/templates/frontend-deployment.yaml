apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: chatbot-frontend
  template:
    metadata:
      labels:
        app: chatbot-frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: chatbot-frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: {{ .Values.frontend.containerPort }}
          # readiness:通過才會被 Service 放進流量名單。沒有它,容器一啟動就被當成 Ready,
          # 滾動更新時 uvicorn 還沒開始監聽,請求就會 502(Day 23 端到端測試實際踩到)。
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.containerPort }}
            periodSeconds: 3
            failureThreshold: 3
          # liveness:卡死(不再回應)時重啟容器。initialDelay 給啟動時間,避免剛起來就被殺。
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          # 優雅下線:Pod 被刪除時,「從 Service/Ingress 名單移除」和「送 SIGTERM」是同時發生、互不等待的,
          # ingress-nginx 可能還在把請求送給正在關閉的 Pod → 502。先睡 5 秒,讓名單更新傳播完再關。
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}