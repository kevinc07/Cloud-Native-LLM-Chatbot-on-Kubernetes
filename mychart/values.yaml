replicaCount: 3

backend:
  image:
    repository: acrchatbotkevin.azurecr.io/chatbot-backend
    tag: v6
  containerPort: 8000
  service:
    port: 3030
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 2
  image:
    repository: acrchatbotkevin.azurecr.io/chatbot-frontend
    tag: v3
  containerPort: 8080
  service:
    port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

config:
  geminiModel: "gemini-3.6-flash"
  temperature: "0.6"
  corsOrigins: "http://chatbot.local"

secretName: chatbot-secret

# backend 的自動擴縮。啟用後 replicaCount 不再生效,副本數由 HPA 決定。
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

mongo:
  image: mongo:7
  storageClass: managed-csi
  storage: 5Gi
  # 事先用 kubectl create secret 建立,含 MONGO_INITDB_ROOT_USERNAME / PASSWORD
  secretName: mongo-secret
  db: chatbot

ingress:
  frontendHost: chatbot.local
  backendHost: api.chatbot.local