worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # 非 root user 沒權限寫 /var/run,把 nginx 需要的暫存路徑都搬到 /tmp
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA:找不到實體檔案就 fallback 回 index.html,交給 React Router 處理
    # (現在還沒用到 router,但先留著,之後加路由不用回頭改這裡)
    #
    # 快取:index.html(與 public/ 下沒有雜湊的檔案)每次都要回伺服器確認(no-cache ≠ 不快取,
    # 沒變會回 304)。沒有這行時瀏覽器會自己猜快取時間,發版後使用者可能還看到舊版。
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }

    # Vite 產生的檔名帶內容雜湊(index-HJPReCcl.js),內容變了檔名就變,可以放心快取一年。
    # 找不到就 404,不能 fallback 回 index.html——否則 HTML 會被當成 JS 快取一年。
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
  }
}
