apiVersion: v1
kind: Service
metadata:
  name: chatbot-backend
  # ServiceMonitor 用這個 label 找到這個 Service(只有 backend 有,frontend/mongo 沒有)。
  labels:
    app: chatbot-backend
spec:
  type: ClusterIP
  selector:
    app: chatbot-backend
  ports:
    # 給 port 取名字:ServiceMonitor 是用「名字」指定要抓哪個 port,不是用號碼。
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.containerPort }}
