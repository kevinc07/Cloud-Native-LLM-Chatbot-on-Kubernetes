apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatbot-backend
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  ingressClassName: nginx
  rules:
    - host: chatbot.local
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: chatbot-frontend
                port:
                  number: 8080
    - host: api.chatbot.local
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: chatbot-backend
                port:
                  number: 3030