apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-backend
spec:
  # 啟用 HPA 時不能在這裡寫 replicas:否則每次 helm upgrade 都會把 HPA 調好的
  # 副本數蓋回固定值,HPA 的擴縮就白做了。副本數交給 HPA 管。
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: chatbot-backend
  template:
    metadata:
      labels:
        app: chatbot-backend
      annotations:
        # ConfigMap 內容一變,這個 hash 就跟著變 → Pod template 變了 → 自動滾動重啟。
        # 沒有它的話,helm upgrade 改了 ConfigMap,舊 Pod 還在用舊值(envFrom 只在啟動時讀一次)。
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # 預設 K8s 會把「同 namespace 每個 Service」注入成環境變數(例如 Service redis → REDIS_PORT=tcp://10.0.x.x:6379),
      # 剛好撞上我們自己的 REDIS_PORT 設定。我們用 DNS 名稱找服務,不需要這些變數,關掉最乾淨。
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: chatbot-backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports:
            - containerPort: {{ .Values.backend.containerPort }}
          # readiness:通過才會被 Service 放進流量名單。沒有它,容器一啟動就被當成 Ready,
          # 滾動更新時 uvicorn 還沒開始監聽,請求就會 502(Day 23 端到端測試實際踩到)。
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.containerPort }}
            periodSeconds: 3
            failureThreshold: 3
          # liveness:卡死(不再回應)時重啟容器。initialDelay 給啟動時間,避免剛起來就被殺。
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          # 優雅下線:Pod 被刪除時,「從 Service/Ingress 名單移除」和「送 SIGTERM」是同時發生、互不等待的,
          # ingress-nginx 可能還在把請求送給正在關閉的 Pod → 502。先睡 5 秒,讓名單更新傳播完再關。
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # requests = 排程時保證給你的量,也是 HPA 算「使用率%」的分母。
          # limits   = 上限:CPU 超過會被限速(throttle),記憶體超過會被 OOMKilled。
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: chatbot-config
            - secretRef:
                name: {{ .Values.secretName }}
          # Mongo 帳密從 Secret 取值並改名成 app 用的變數(不寫死在程式或 YAML)。
          env:
            {{- if .Values.langsmith.enabled }}
            # LangSmith:LangChain 看到這幾個環境變數就會自動把每次 LLM 呼叫的
            # prompt / 回應 / token 用量送去 smith.langchain.com,不用改程式邏輯。
            - name: LANGSMITH_TRACING
              value: "true"
            - name: LANGSMITH_PROJECT
              value: {{ .Values.langsmith.project | quote }}
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langsmith.secretName }}
                  key: LANGSMITH_API_KEY
            {{- end }}
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongo.secretName }}
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongo.secretName }}
                  key: MONGO_INITDB_ROOT_PASSWORD